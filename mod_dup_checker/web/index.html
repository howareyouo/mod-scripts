<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mod 重复检测</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<h1>mod 重复检测</h1>
<p class="hint">仅比较 <code>natives/</code> 下的文件，<code>modinfo.ini</code>、截图等不参与</p>

<div class="panel" style="margin-top:16px">
  <label for="roots">mod 集合目录（一行一个，会自动递归找「自身含 natives 子目录」的 mod）</label>
  <textarea id="roots" spellcheck="false" placeholder="E:\Dedup\Ada Side Slit Cheongsam&#10;E:\Dedup\Ada Side Slit Cheongsam_"></textarea>
  <div class="row">
    <button id="btn-browse" hidden>选择目录…</button>
    <label>线程数 <select id="jobs">__JOBS_OPTIONS__</select></label>
    <span class="grow"></span>
    <button id="btn-scan" class="primary">开始扫描</button>
    <button id="btn-cancel" disabled>取消</button>
  </div>
  <p class="hint" style="margin-top:8px">机械硬盘建议把线程数调到 2；SSD 默认即可。判定重复必须内容完全一致，不会只看路径和大小。</p>
</div>

<div class="panel" id="progress-panel" hidden>
  <div class="phase" id="phase">准备中</div>
  <div class="bar"><div id="bar"></div></div>
  <div class="kv">
    <div>已扫描 mod：<b id="p-mods">0 / 0</b></div>
    <div>本阶段文件：<b id="p-files">0 / 0</b></div>
    <div>已读字节：<b id="p-bytes">0 B</b></div>
    <div>耗时：<b id="p-elapsed">0.0s</b></div>
  </div>
  <div class="path" id="p-current" style="margin-top:10px"></div>
</div>

<div id="banners"></div>
<div id="results"></div>
<div id="empty-wrap"></div>
<div id="warn-wrap"></div>

<footer>
  <button id="btn-json" disabled>导出 JSON</button>
  <button id="btn-csv" disabled>导出 CSV</button>
  <span class="hint" id="foot-hint">扫描结束后可导出。</span>
</footer>

<script src="/app.js"></script>
</body>
</html>
